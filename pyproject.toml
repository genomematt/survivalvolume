[project]
name = "survivalvolume"
version = "2.0.0b1"
description = "Plotting tools for survival data"
authors = [
    { name = "Matthew Wakefield", email = "matthew.wakefield@unimelb.edu.au" }
]
license = { text = "GPLv3" }
requires-python = ">=3.11"
dependencies = [
    "lifelines>=0.26",
    "matplotlib>=3.3",
    "numpy>=1.16.5",
    "pandas>=1.2",
    "xlrd>=2.0.1",
    "openpyxl>=3.0.9",
    "Jinja2>=3.0.3",
    "ipython>=6.0",
    "ipympl>=0.10.0",
    "scipy>=1.7",
    "mpld3>=0.5.7", #to be removed prior to release
    "ipykernel>=7.2.0",
    "pandas-stubs~=2.3.3",
    "plotly>=6.6.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
